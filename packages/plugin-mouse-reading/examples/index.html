<!DOCTYPE html>
<html>
  <head>
    <title>jsPsychMouseReading Example</title>
    <script src="https://unpkg.com/jspsych"></script>
    <!-- Once this plugin package is published, you can load it from a CDN instead:
<script src="https://unpkg.com/@jspsych-contrib/plugin-mouse-reading"></script> -->
    <script src="../dist/index.browser.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/jspsych/css/jspsych.css" />
  </head>

  <body></body>
  <script>
  const jsPsych = initJsPsych({
    on_finish: () => { jsPsych.data.displayData(); }
  });

  const trial = {
    type: jsPsychMouseReading,
    text_lines: ["Mr. Watson,", "Come here", "I want to see you"],
    line_height: 32,
    text_offset: [50, 50],
    aperture_shape: "roundrectangular",
    aperture_width: 60,
    aperture_height: 30,
    aperture_blur: 2, // try 10 for smoother transition
    button_offset: [30, 10],
    button_size: 20,
    font_family: "Times New Roman",
    font_size: "28px",
    font_color: "black",
    canvas_colour: "#EEEEEE",
    aperture_colour: "pink", //"#FFFFFF",
    store_image_data: false,
    // canvas_size: [2000, 500],
  };

  jsPsych.run([trial])
  </script>
</html>
